<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="title" content="InfyBonus">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline — InfyBonus</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ib-bg:        #f6f5fb;
            --ib-surface:   #ffffff;
            --ib-line:      #e6e4f2;
            --ib-indigo-1:  #6b719b;
            --ib-indigo-2:  #9da3cc;
            --ib-indigo-3:  #979dce;
            --ib-deep:      #4a4e73;
            --ib-text:      #2c2e42;
            --ib-muted:     #83839c;
            --ib-coin:      #f4b942;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background:
                radial-gradient(circle at 15% 12%, rgba(151,157,206,.18), transparent 42%),
                radial-gradient(circle at 88% 82%, rgba(107,113,155,.14), transparent 45%),
                var(--ib-bg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--ib-text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: var(--ib-surface);
            border: 1px solid var(--ib-line);
            border-radius: 24px;
            padding: 48px 40px 36px;
            box-shadow:
                0 1px 2px rgba(74,78,115,.04),
                0 24px 48px -20px rgba(74,78,115,.18);
            text-align: center;
            position: relative;
        }

        /* ── Signature visual: beacon trying to reconnect, bonus tokens orbiting ── */
        .beacon-wrap {
            position: relative;
            width: 168px;
            height: 168px;
            margin: 0 auto 8px;
        }

        .beacon-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1.5px solid var(--ib-indigo-2);
            opacity: 0;
            animation: ringPulse 2.8s ease-out infinite;
        }
        .beacon-ring.r2 { animation-delay: .9s; }
        .beacon-ring.r3 { animation-delay: 1.8s; }

        @keyframes ringPulse {
            0%   { transform: scale(.55); opacity: .55; border-color: var(--ib-indigo-3); }
            70%  { opacity: .12; }
            100% { transform: scale(1);   opacity: 0; }
        }

        .beacon-core {
            position: absolute;
            top: 50%; left: 50%;
            width: 64px; height: 64px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: linear-gradient(135deg, var(--ib-indigo-1), var(--ib-indigo-3));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 24px -8px rgba(107,113,155,.55);
        }

        .beacon-core svg { width: 28px; height: 28px; }

        /* Bonus token chips drifting around the beacon */
        .coin {
            position: absolute;
            width: 30px; height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd873, var(--ib-coin));
            display: flex; align-items: center; justify-content: center;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 11px;
            color: #7a5200;
            box-shadow: 0 6px 14px -6px rgba(244,185,66,.7);
        }
        .coin-a { top: 6px; right: 14px;  animation: floatA 5.5s ease-in-out infinite; }
        .coin-b { bottom: 10px; left: 6px; animation: floatB 6.5s ease-in-out infinite; }

        @keyframes floatA {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-9px) rotate(6deg); }
        }
        @keyframes floatB {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(8px) rotate(-8deg); }
        }

        .eyebrow {
            font-family: 'Sora', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--ib-indigo-1);
            margin: 4px 0 14px;
        }

        h1.headline {
            font-family: 'Sora', sans-serif;
            font-size: 27px;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -.3px;
            margin: 0 0 12px;
            color: var(--ib-deep);
        }

        p.sub {
            font-size: 14.5px;
            line-height: 1.65;
            color: var(--ib-muted);
            margin: 0 0 30px;
            padding: 0 6px;
        }

        p.sub strong { color: var(--ib-text); font-weight: 600; }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 13px 20px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: transform .15s ease, box-shadow .2s ease, opacity .2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--ib-indigo-1), var(--ib-deep));
            color: #fff;
            box-shadow: 0 10px 22px -10px rgba(74,78,115,.55);
        }
        .btn-primary:hover { transform: translateY(-1px); opacity: .95; }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: .7; cursor: default; transform: none; }

        .btn-secondary {
            background: transparent;
            color: var(--ib-muted);
            border: 1.5px solid var(--ib-line);
        }
        .btn-secondary:hover { border-color: var(--ib-indigo-2); color: var(--ib-deep); }

        .spinner {
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.4);
            border-top-color: #fff;
            animation: spin .7s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Status line under the buttons */
        .status-line {
            margin-top: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            color: var(--ib-muted);
        }

        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #e15b5b;
            box-shadow: 0 0 0 3px rgba(225,91,91,.15);
            flex-shrink: 0;
            transition: background .3s ease, box-shadow .3s ease;
        }
        .status-dot.checking {
            background: var(--ib-indigo-2);
            box-shadow: 0 0 0 3px rgba(157,163,204,.2);
            animation: dotPulse 1s ease-in-out infinite;
        }
        .status-dot.online {
            background: #3fb87f;
            box-shadow: 0 0 0 3px rgba(63,184,127,.18);
            animation: none;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: .4; }
        }

        @media (max-width: 480px) {
            .card { padding: 40px 26px 30px; border-radius: 20px; }
            h1.headline { font-size: 23px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .beacon-ring, .coin, .status-dot.checking { animation: none !important; }
        }
    </style>
</head>
<body>

    <div class="card" role="main" aria-labelledby="offline-headline">

        <div class="beacon-wrap" aria-hidden="true">
            <div class="beacon-ring r1"></div>
            <div class="beacon-ring r2"></div>
            <div class="beacon-ring r3"></div>
            <div class="coin coin-a">+5</div>
            <div class="coin coin-b">+10</div>
            <div class="beacon-core">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 8.82C7.5 3.5 16.5 3.5 22 8.82" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity=".45"/>
                    <path d="M5.5 12.5C9.5 8.7 14.5 8.7 18.5 12.5" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity=".75"/>
                    <path d="M9 16C10.9 14.2 13.1 14.2 15 16" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="12" cy="19.2" r="1.4" fill="white"/>
                    <line x1="3" y1="3" x2="21" y2="21" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </div>
        </div>

        <p class="eyebrow">Connection lost</p>
        <h1 class="headline" id="offline-headline">Signal's out —<br>not your bonus.</h1>
        <p class="sub">
            Your points and rewards are saved right where you left them.
            We just can't reach <strong>InfyBonus</strong> at the moment —
            check your connection and we'll pick things back up.
        </p>

        <div class="actions">
            <button class="btn btn-primary" id="retry-btn" onclick="manualRetry()">
                <span class="spinner" id="retry-spinner"></span>
                <span id="retry-label">Try again</span>
            </button>
            <a href="/" class="btn btn-secondary">Back to home</a>
        </div>

        <div class="status-line">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Still offline</span>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            const dot     = document.getElementById('status-dot');
            const text    = document.getElementById('status-text');
            const btn     = document.getElementById('retry-btn');
            const spinner = document.getElementById('retry-spinner');
            const label   = document.getElementById('retry-label');

            let checking = false;

            function setState(state) {
                // state: 'offline' | 'checking' | 'online'
                dot.classList.remove('checking', 'online');
                if (state === 'checking') {
                    dot.classList.add('checking');
                    text.textContent = 'Checking connection…';
                } else if (state === 'online') {
                    dot.classList.add('online');
                    text.textContent = 'Back online — redirecting…';
                } else {
                    text.textContent = 'Still offline';
                }
            }

            // Ping a tiny same-origin resource to confirm real connectivity
            // (navigator.onLine alone can be unreliable, e.g. connected to
            // a Wi-Fi with no internet access).
            async function pingServer() {
                try {
                    const res = await fetch('/', {
                        method: 'HEAD',
                        cache: 'no-store',
                        signal: AbortSignal.timeout(4000),
                    });
                    return res.ok;
                } catch {
                    return false;
                }
            }

            async function attemptReconnect(isManual) {
                if (checking) return;
                checking = true;
                setState('checking');

                if (isManual) {
                    btn.disabled = true;
                    spinner.style.display = 'inline-block';
                    label.textContent = 'Checking…';
                }

                const ok = await pingServer();

                if (ok) {
                    setState('online');
                    setTimeout(() => window.location.reload(), 600);
                    return;
                }

                setState('offline');
                if (isManual) {
                    btn.disabled = false;
                    spinner.style.display = 'none';
                    label.textContent = 'Try again';
                }
                checking = false;
            }

            window.manualRetry = () => attemptReconnect(true);

            // Passive background retry every 6s
            setInterval(() => attemptReconnect(false), 6000);

            // Also react immediately to browser online/offline events
            window.addEventListener('online', () => attemptReconnect(false));
            window.addEventListener('offline', () => setState('offline'));

            setState('offline');
        })();
    </script>

</body>
</html>
